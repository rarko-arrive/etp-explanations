# Local smoke test for the production image.
#   DOCKER_BUILDKIT=1 docker compose build
#   DQT_DATA=../etp-dqt/data docker compose up
#
# Requires: docker build --ssh default (private arriveds git dep)

services:
  explainer:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
    image: etp-explainer:local
    ports:
      - "8765:8765"
    environment:
      DQT_DATA_DIR: /data
      EXPLAIN_CACHE_DIR: /cache
      EXPLAIN_HOST: 0.0.0.0
      EXPLAIN_PORT: "8765"
      EXPLAIN_BEHIND_PROXY: "1"
      # Optional lake mirror (second bind mount):
      # DQT_USE_LAKE_MIRROR: "1"
      # DQT_LAKE_MIRROR: /mirror/etp_lake
    volumes:
      - ${DQT_DATA:-./data}:/data:ro
      - explainer-cache:/cache
      # - ${LAKE_MIRROR:-./mirror}:/mirror/etp_lake:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  explainer-cache:
