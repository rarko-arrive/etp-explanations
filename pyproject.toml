[project]
name = "etp-explanations"
version = "0.1.0"
description = "ETP shipment lifecycle explanations — material change ledger and HC outlier cohort"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "arriveds[azure]",
    "ipykernel>=7.3.0",
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqt", "scripts", "app"]

[tool.hatch.build.targets.wheel.force-include]
"app/explain/templates/explain.html" = "app/explain/templates/explain.html"
"app/explain/templates/index.html" = "app/explain/templates/index.html"

[tool.uv.sources]
arriveds = { git = "ssh://git@github.com/rarko-arrive/arrive-ds.git", rev = "v0.3.2" }

[dependency-groups]
serve = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "httpx>=0.28.0",
    "pre-commit>=4.0.0",
    "sqlfluff>=3.4.0",
    { include-group = "serve" },
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["C408", "RUF046"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
"src/dqt/etp_slider/drift/mde_timeline.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
